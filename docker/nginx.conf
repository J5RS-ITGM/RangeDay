server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # Client-side routes must serve the shell, not 404, on refresh
    location / {
        try_files $uri /index.html;
    }

    # The service worker must never be cached stale, or updates stick
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles are immutable — cache hard
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
